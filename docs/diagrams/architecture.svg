<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" width="980" height="520" role="img" aria-label="Spectators and organizers reach one Docker container on port 8080 through the DigitalOcean firewall. Express serves pages and the API, loads seed.json at start, reads and writes SQLite, and asks the rules engine for results. SQLite is a file on the droplet's disk. The other service runs separately.">
  <title>Architecture: one container on the shared droplet</title>
  <style>
    .bg{fill:#FFFFFF}
    .box{fill:#F3F6F4;stroke:#C8D4CC;stroke-width:1.5}
    .box2{fill:#E6EEE8}
    .boxa{fill:#D7ECE0;stroke:#14744B;stroke-width:1.5}
    .ghost{fill:none;stroke:#55645B;stroke-width:1.2;stroke-dasharray:5 4}
    .frame{fill:none;stroke:#55645B;stroke-width:1.2;stroke-dasharray:7 5}
    .container{fill:none;stroke:#14744B;stroke-width:2}
    .band{fill:#FBEBD3;stroke:#9A5300;stroke-width:1.2}
    .edge{stroke:#16211B;stroke-width:1.5;fill:none}
    .ah{fill:#16211B}
    text{fill:#16211B;font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
    .tt{font-size:13px;font-weight:600}
    .ts{font-size:11.5px}
    .tm{font-size:11px;fill:#55645B}
    .tmute{fill:#55645B}
    .ta{fill:#14744B}
    .tw{font-size:11px;fill:#9A5300;font-weight:600}
    .b{font-weight:600}.n{font-weight:400}
    .mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;font-size:12px}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <rect class="bg" width="980" height="520"/>

  <rect class="frame" x="342" y="24" width="618" height="486" rx="10"/>
  <text class="tt" x="372" y="50">DigitalOcean droplet <tspan class="tm n">· already runs your other service</tspan></text>

  <rect class="container" x="376" y="66" width="566" height="330" rx="8"/>
  <text class="tt ta" x="392" y="90">Badminton container <tspan class="tm n">· compose project “badminton” · port 8080 → 3000</tspan></text>

  <rect class="box" x="392" y="104" width="196" height="276" rx="6"/>
  <text class="tt" x="408" y="128">Node.js + Express</text>
  <rect class="box2" x="404" y="142" width="172" height="64" rx="4"/>
  <text class="ts b" x="416" y="164">Web pages</text>
  <text class="tm" x="416" y="181">HTML · CSS · JS</text>
  <text class="tm" x="416" y="196">Vietnamese / English</text>
  <rect class="box2" x="404" y="216" width="172" height="64" rx="4"/>
  <text class="ts b" x="416" y="238">Public API</text>
  <text class="tm" x="416" y="255">GET /api/state</text>
  <text class="tm" x="416" y="270">no login</text>
  <rect class="box2" x="404" y="290" width="172" height="78" rx="4"/>
  <text class="ts b" x="416" y="312">Admin API</text>
  <text class="tm" x="416" y="329">admin PIN · lockout</text>
  <text class="tm" x="416" y="344">scores · live · serve</text>
  <text class="tm" x="416" y="359">walkover · draw lots</text>

  <rect class="boxa" x="652" y="104" width="274" height="112" rx="6"/>
  <text class="tt" x="668" y="128">Rules engine</text>
  <text class="tm" x="668" y="145">pure functions · unit-tested</text>
  <text class="ts" x="668" y="168">scores · live sets · serving</text>
  <text class="ts" x="668" y="185">standings · tiebreaks · draw lots</text>
  <text class="ts" x="668" y="202">locks · bracket · podium</text>

  <rect class="box" x="652" y="232" width="274" height="52" rx="6"/>
  <text class="ts" x="668" y="253"><tspan class="b">seed.json</tspan> · 7 teams · 13 matches</text>
  <text class="tm" x="668" y="272">.env · ADMIN_PIN (6+ chars), never in git</text>

  <rect class="box" x="652" y="300" width="274" height="80" rx="6"/>
  <text class="tt" x="668" y="324">SQLite</text>
  <text class="tm" x="668" y="342">stores only what people enter:</text>
  <text class="ts" x="668" y="362">sets · live points · walkovers · draws</text>

  <line class="edge" x1="589" y1="150" x2="650" y2="150" marker-end="url(#a)"/>
  <text class="tm" x="620" y="142" text-anchor="middle">inputs</text>
  <line class="edge" x1="651" y1="174" x2="590" y2="174" marker-end="url(#a)"/>
  <text class="tm" x="620" y="190" text-anchor="middle">results</text>
  <line class="edge" x1="651" y1="258" x2="590" y2="258" marker-end="url(#a)"/>
  <text class="tm" x="620" y="250" text-anchor="middle">at start</text>
  <line class="edge" x1="590" y1="340" x2="650" y2="340" marker-start="url(#a)" marker-end="url(#a)"/>
  <text class="tm" x="620" y="332" text-anchor="middle">read/write</text>

  <line class="edge" x1="789" y1="381" x2="789" y2="424" marker-end="url(#a)"/>
  <text class="tm" x="800" y="410">volume</text>
  <rect class="box" x="652" y="426" width="274" height="72" rx="6"/>
  <text class="tt mono" x="668" y="450">./data/tournament.db</text>
  <text class="tm" x="668" y="468">on the droplet's disk · survives rebuilds</text>
  <text class="tm" x="668" y="486">back up with npm run backup</text>

  <rect class="ghost" x="392" y="426" width="196" height="72" rx="6"/>
  <text class="tt tmute" x="408" y="450">Your other service</text>
  <text class="tm" x="408" y="468">own project and ports</text>
  <text class="tm" x="408" y="486">not touched</text>

  <rect class="box" x="20" y="148" width="170" height="64" rx="6"/>
  <text class="tt" x="36" y="174">Spectators</text>
  <text class="tm" x="36" y="194">phones · view only</text>
  <rect class="box" x="20" y="288" width="170" height="64" rx="6"/>
  <text class="tt" x="36" y="314">Organizers</text>
  <text class="tm" x="36" y="334">and referees · admin PIN</text>

  <line class="edge" x1="190" y1="180" x2="390" y2="180" marker-end="url(#a)"/>
  <text class="ts" x="198" y="172">GET /api/state</text>
  <text class="tm" x="198" y="197">3 s live · 15 s idle</text>
  <line class="edge" x1="190" y1="320" x2="390" y2="320" marker-end="url(#a)"/>
  <text class="ts" x="198" y="312">writes + admin PIN</text>
  <text class="tm" x="198" y="337">live points · sets</text>

  <rect class="band" x="330" y="120" width="24" height="250" rx="4"/>
  <text class="tw" transform="translate(346 245) rotate(-90)" text-anchor="middle">Firewall · 8080 open · 22 your IP</text>
</svg>
