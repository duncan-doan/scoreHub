<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" role="img" aria-label="The referee sets which side serves first, then each tap posts a point with the current point count and the admin PIN. The server checks the PIN and the count, adds the point, checks whether the set is over, saves it to SQLite and returns the score with the next server and a change-ends reminder at 11. Spectator phones poll every 3 seconds; the server reads the inputs, the rules engine computes score, serve, standings and bracket, and the server returns them.">
  <title>One live point, from referee to spectators</title>
  <style>
    .bg{fill:#FFFFFF}
    .box{fill:#F3F6F4;stroke:#C8D4CC;stroke-width:1.5}
    .box2{fill:#E6EEE8}
    .boxa{fill:#D7ECE0;stroke:#14744B;stroke-width:1.5}
    .edge{stroke:#16211B;stroke-width:1.5;fill:none}
    .edge-a{stroke:#14744B;stroke-width:2;fill:none}
    .edge-d{stroke:#55645B;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
    .life{stroke:#C8D4CC;stroke-width:1.5;stroke-dasharray:4 5;fill:none}
    .ah{fill:#16211B}.ah-a{fill:#14744B}.ah-m{fill:#55645B}
    text{fill:#16211B;font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
    .tt{font-size:13px;font-weight:600}
    .ts{font-size:11.5px}
    .tm{font-size:11px;fill:#55645B}
  </style>
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-a" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-m" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <rect class="bg" width="980" height="470"/>

  <rect class="box" x="20" y="16" width="180" height="46" rx="6"/>
  <text class="tt" x="110" y="36" text-anchor="middle">Referee phone</text>
  <text class="tm" x="110" y="53" text-anchor="middle">admin PIN saved</text>
  <rect class="boxa" x="280" y="16" width="240" height="46" rx="6"/>
  <text class="tt" x="400" y="36" text-anchor="middle">Server</text>
  <text class="tm" x="400" y="53" text-anchor="middle">Express + rules engine</text>
  <rect class="box" x="570" y="16" width="160" height="46" rx="6"/>
  <text class="tt" x="650" y="36" text-anchor="middle">SQLite</text>
  <text class="tm" x="650" y="53" text-anchor="middle">tournament.db</text>
  <rect class="box" x="780" y="16" width="180" height="46" rx="6"/>
  <text class="tt" x="870" y="36" text-anchor="middle">Spectator phone</text>
  <text class="tm" x="870" y="53" text-anchor="middle">no login</text>

  <line class="life" x1="110" y1="62" x2="110" y2="458"/>
  <line class="life" x1="400" y1="62" x2="400" y2="458"/>
  <line class="life" x1="650" y1="62" x2="650" y2="458"/>
  <line class="life" x1="870" y1="62" x2="870" y2="458"/>

  <line class="edge" x1="110" y1="96" x2="398" y2="96" marker-end="url(#f)"/>
  <text class="ts" x="254" y="88" text-anchor="middle">PUT /serve · side 1 first (toss)</text>
  <text class="tm" x="20" y="119">later…</text>

  <line class="edge-a" x1="110" y1="134" x2="398" y2="134" marker-end="url(#g)"/>
  <text class="ts" x="254" y="126" text-anchor="middle">POST /point · side 1 · count 12</text>

  <rect class="box2" x="270" y="148" width="260" height="34" rx="4"/>
  <text class="ts" x="400" y="169" text-anchor="middle">PIN ok? count is 12? add · set over?</text>

  <line class="edge" x1="400" y1="206" x2="648" y2="206" marker-end="url(#f)"/>
  <text class="tm" x="525" y="198" text-anchor="middle">save the point</text>

  <line class="edge-d" x1="400" y1="244" x2="112" y2="244" marker-end="url(#m)"/>
  <text class="ts" x="254" y="236" text-anchor="middle">score · next server and court</text>
  <text class="tm" x="254" y="260" text-anchor="middle">“change ends” at 11</text>

  <line class="edge" x1="870" y1="300" x2="402" y2="300" marker-end="url(#f)"/>
  <text class="ts" x="860" y="292" text-anchor="end">GET /api/state · every 3 s</text>

  <line class="edge" x1="400" y1="338" x2="648" y2="338" marker-end="url(#f)"/>
  <text class="tm" x="525" y="330" text-anchor="middle">read inputs</text>

  <rect class="box2" x="240" y="354" width="320" height="34" rx="4"/>
  <text class="ts" x="400" y="375" text-anchor="middle">rules engine: score, serve, standings, bracket</text>

  <line class="edge-d" x1="400" y1="420" x2="868" y2="420" marker-end="url(#m)"/>
  <text class="ts" x="860" y="412" text-anchor="end">live score · serve · standings</text>
</svg>
